<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekran — TV launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pad:120px;--ease:cubic-bezier(.2,.8,.2,1);--glass:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#04050a;transform-origin:center}

/* pozadina */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.06);transition:opacity 1.2s var(--ease),transform 9s linear;will-change:opacity,transform}
.bg.on{opacity:1;transform:scale(1)}
.shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(4,5,10,.94) 0%,rgba(4,5,10,.7) 32%,rgba(4,5,10,.1) 68%,rgba(4,5,10,0) 100%),
  linear-gradient(0deg,rgba(4,5,10,1) 0%,rgba(4,5,10,.88) 26%,rgba(4,5,10,0) 58%),
  linear-gradient(180deg,rgba(4,5,10,.6) 0%,rgba(4,5,10,0) 22%)}

/* gornja traka */
.top{position:absolute;top:52px;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:center;z-index:6}
.hello{font-size:28px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:14px}
.hello .orb{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 200deg,#6ee7ff,#8b5cf6,#f472b6,#6ee7ff);box-shadow:0 0 18px rgba(139,92,246,.8)}
.tright{display:flex;align-items:center;gap:44px}
.weather{display:flex;align-items:center;gap:16px;opacity:0;transition:opacity .6s}
.weather.on{opacity:1}
.weather svg{width:52px;height:52px}
.weather .wt{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1}
.weather .wd{font-size:19px;color:rgba(255,255,255,.62);margin-top:6px;white-space:nowrap}
.wsep{width:1px;height:58px;background:rgba(255,255,255,.18)}
.clock{text-align:right}
.clock .t{font-size:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{font-size:19px;color:rgba(255,255,255,.62);margin-top:6px}
.gear{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);transition:transform .25s var(--ease),background .25s,color .25s;cursor:pointer}
.gear svg{width:30px;height:30px}
.gear.focus{background:#fff;color:#05060a;transform:scale(1.12)}

/* hero */
.hero,.info{position:absolute;left:var(--pad);z-index:5;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.hero{top:232px;width:1180px}
.kicker{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:.16em}
.kicker .pill{background:var(--glass);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 14px;letter-spacing:.1em;font-size:16px;color:#fff}
.hero .title{font-size:116px;font-weight:800;letter-spacing:-.05em;line-height:.95;margin:24px 0 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .title.long{font-size:72px;white-space:normal;line-height:1.02;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:22px;color:rgba(255,255,255,.75);display:flex;gap:14px;align-items:center;font-weight:500}
.meta .sep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5)}
.meta .badge{border:1.5px solid rgba(255,255,255,.55);border-radius:6px;padding:1px 8px;font-size:15px;font-weight:700}
.meta .star{color:#ffd166}
.desc{font-size:24px;line-height:1.45;color:rgba(255,255,255,.72);margin-top:18px;max-width:800px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:18px;margin-top:38px;align-items:center;min-height:76px}
.btn{height:70px;border-radius:35px;padding:0 40px;display:flex;align-items:center;gap:14px;font-size:25px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);transition:transform .28s var(--ease),background .28s,color .28s,box-shadow .28s;cursor:pointer;white-space:nowrap}
.btn svg{width:26px;height:26px;flex:none}
.btn.round{width:70px;padding:0;justify-content:center}
.btn.focus{background:#fff;color:#05060a;transform:scale(1.09);box-shadow:0 20px 50px rgba(0,0,0,.55)}
.btn.dis{opacity:.4}
.dots{display:flex;gap:10px;margin-top:44px}
.dots i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.3);transition:width .5s var(--ease),background .5s}
.dots i.on{width:34px;background:#fff}
.hero .kicker,.hero .title,.hero .meta,.hero .desc{transition:opacity .45s var(--ease),transform .55s var(--ease)}
.hero.swap .kicker,.hero.swap .title,.hero.swap .meta,.hero.swap .desc{opacity:0;transform:translateY(14px)}

.info{top:196px;width:1000px;opacity:0;transform:translateY(20px);pointer-events:none}
.info .title{font-size:76px;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:18px 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .title.long{font-size:58px}
.compact .hero{opacity:0;transform:translateY(-40px);pointer-events:none}
.compact .info{opacity:1;transform:none}
.info.swap{opacity:0!important;transition-duration:.12s}
#stage.covered .hero,#stage.covered .info,#stage.covered .track,#stage.covered .top{opacity:0!important;pointer-events:none}
.top{transition:opacity .4s}

/* redovi */
.track{position:absolute;left:0;right:0;top:0;z-index:4;transition:transform .6s var(--ease);will-change:transform}
.row{position:absolute;left:0;right:0;transition:opacity .45s var(--ease)}
.row.gone{opacity:0}
.row h3{font-size:27px;font-weight:700;margin-left:var(--pad);height:40px;margin-bottom:24px;color:rgba(255,255,255,.92);letter-spacing:-.01em;display:flex;align-items:center;gap:14px}
.row h3 small{font-size:18px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:0}
.strip{display:flex;gap:30px;padding-left:var(--pad);transition:transform .5s var(--ease);will-change:transform}
.card{flex:none;position:relative;transition:transform .32s var(--ease);cursor:pointer}
.card .img{position:relative;width:100%;border-radius:22px;background-size:cover;background-position:center;overflow:hidden;background-color:#151821;transition:box-shadow .32s var(--ease)}
.card .img::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 38%);opacity:0;transition:opacity .35s;pointer-events:none}
.card.focus{transform:scale(1.1);z-index:3}
.card.focus .img{box-shadow:0 0 0 4px #fff,0 34px 70px rgba(0,0,0,.65)}
.card.focus .img::after{opacity:1}
.card.moving .img{box-shadow:0 0 0 4px #ffd166,0 34px 70px rgba(0,0,0,.65)!important}
.fav{position:absolute;right:12px;top:10px;font-size:22px;color:#ffd166;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2}

.app .img,.live .img{display:flex;align-items:center;justify-content:center}
.app .img svg{width:64px;height:64px}
.app .img img.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.app .img img.ico{width:96px;height:96px;object-fit:contain}
.app.glass .img{background:rgba(255,255,255,.1)}
.app .lbl,.live .lbl{position:absolute;left:-20px;right:-20px;top:calc(100% + 18px);text-align:center;font-size:21px;font-weight:600;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .3s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.focus .lbl,.live.focus .lbl{opacity:1;transform:none}
.live .img{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08)}
.live .img img{max-width:62%;max-height:58%;object-fit:contain}
.live .img .cname{font-size:30px;font-weight:800;letter-spacing:-.02em;text-align:center;padding:0 18px;line-height:1.05}
.live .img .ldot{position:absolute;left:14px;top:12px;width:10px;height:10px;border-radius:50%;background:#ff3045;box-shadow:0 0 10px #ff3045}

.vid .cap{position:relative;z-index:1;margin-top:18px;transition:opacity .3s}
.vid .cap b{display:block;font-size:22px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .cap span{display:block;font-size:18px;color:rgba(255,255,255,.55);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .cap{opacity:.7}.row.active .vid .cap{opacity:.85}.card.focus .cap{opacity:1!important}
.dur{position:absolute;right:14px;bottom:14px;background:rgba(0,0,0,.72);border-radius:8px;padding:4px 9px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.thumbword{position:absolute;left:24px;bottom:22px;right:90px;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:.95;text-shadow:0 4px 24px rgba(0,0,0,.5);text-transform:uppercase}
.prog{position:absolute;left:18px;right:18px;bottom:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px}
.news .src{position:absolute;left:16px;top:14px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border-radius:8px;padding:4px 10px;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.news .cap b{-webkit-line-clamp:3}

.poster .img::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 50%)}
.poster .ptitle{position:absolute;left:20px;right:20px;bottom:22px;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.poster .ptitle small{display:block;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:8px}
.poster.real .ptitle,.poster.real .img::before{display:none}
.rate{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.65);border-radius:8px;padding:3px 9px;font-size:16px;font-weight:800;color:#ffd166}

/* slojevi (overlay) */
.layer{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.layer.on{opacity:1;pointer-events:auto}
.glassbg{background:rgba(8,10,16,.66);backdrop-filter:blur(44px) saturate(1.5);-webkit-backdrop-filter:blur(44px) saturate(1.5)}
.layer h2{position:absolute;top:70px;left:var(--pad);font-size:52px;font-weight:800;letter-spacing:-.04em}
.layer h2 small{display:block;font-size:20px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.5);margin-top:8px}
.ghint{position:absolute;top:92px;right:var(--pad);font-size:19px;color:rgba(255,255,255,.5)}
.gridwrap{position:absolute;top:250px;left:0;right:0;bottom:0;overflow:hidden}
.grid{position:relative;width:1740px;margin:0 auto;height:100%}
.grid .card{position:absolute}

/* detalji filma */
#detail{background:linear-gradient(90deg,rgba(4,5,10,.85),rgba(4,5,10,.2) 70%),linear-gradient(0deg,rgba(4,5,10,.95),rgba(4,5,10,0) 50%)}
#detail .dbox{position:absolute;left:var(--pad);top:250px;width:1000px}
#detail .title{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:22px 0}
#detail .desc{-webkit-line-clamp:5;max-width:900px}

/* meni */
#menu{background:rgba(0,0,0,.55)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:640px;background:rgba(24,26,34,.92);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.12);border-radius:34px;padding:40px}
.mbox h4{font-size:28px;font-weight:800;margin-bottom:24px;letter-spacing:-.02em}
.mitem{height:72px;border-radius:20px;display:flex;align-items:center;padding:0 28px;font-size:25px;font-weight:600;margin-top:10px;transition:background .2s,color .2s,transform .2s var(--ease)}
.mitem.focus{background:#fff;color:#05060a;transform:scale(1.03)}

/* player */
#player{background:#000}
#ytWrap,#ytWrap iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0}
#plBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.4)}
.spin{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.osd{position:absolute;left:0;right:0;bottom:0;padding:120px var(--pad) 64px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));transition:opacity .4s;z-index:3}
.osd.hide{opacity:0}
.osd .ot{font-size:40px;font-weight:800;letter-spacing:-.03em}
.osd .oc{font-size:21px;color:rgba(255,255,255,.65);margin-top:6px}
.obar{display:flex;align-items:center;gap:24px;margin-top:28px;font-size:20px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8)}
.obar .bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.obar .bar i{display:block;height:100%;background:#fff;width:0}
.ohint{margin-top:20px;font-size:17px;color:rgba(255,255,255,.45)}
.pstate{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;z-index:3}
.pstate.on{opacity:1}
.pstate svg{width:60px;height:60px}

/* postavke */
#settings .sbox{position:absolute;top:220px;left:var(--pad);right:var(--pad);bottom:40px;overflow:hidden}
.slist{transition:transform .4s var(--ease)}
.sh{font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:34px 0 14px}
.sh:first-child{margin-top:0}
.si{display:flex;align-items:center;gap:30px;min-height:84px;border-radius:24px;padding:12px 30px;background:rgba(255,255,255,.06);margin-bottom:12px;transition:background .2s,transform .25s var(--ease)}
.si.focus{background:rgba(255,255,255,.18);box-shadow:0 0 0 3px #fff;transform:scale(1.01)}
.si .sl{flex:none;width:480px;font-size:24px;font-weight:600}
.si .sl small{display:block;font-size:17px;font-weight:500;color:rgba(255,255,255,.5);margin-top:4px}
.si input{flex:1;height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:500 23px Inter,system-ui,sans-serif;padding:0 20px;outline:none}
.si input:focus{border-color:#fff;background:rgba(0,0,0,.6)}
.si .sv{flex:1;font-size:22px;color:rgba(255,255,255,.7);text-align:right}
.tog{width:76px;height:42px;border-radius:21px;background:rgba(255,255,255,.2);position:relative;margin-left:auto;transition:background .2s}
.tog::after{content:"";position:absolute;left:5px;top:5px;width:32px;height:32px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tog.on{background:#34c759}.tog.on::after{transform:translateX(34px)}

.toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,30px);background:rgba(20,22,30,.86);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);padding:18px 30px;border-radius:999px;font-size:22px;font-weight:600;opacity:0;transition:all .4s var(--ease);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:16px;z-index:30;font-size:16px;color:rgba(255,255,255,.45);display:flex;gap:10px;align-items:center;transition:opacity .6s}
.hint kbd{font-family:inherit;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px 8px;color:rgba(255,255,255,.75)}
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="shade"></div>

  <div class="top">
    <div class="hello"><span class="orb"></span><span id="greet">Dobro veče</span></div>
    <div class="tright">
      <div class="weather" id="weather"><span id="wIco"></span><div><div class="wt" id="wTemp"></div><div class="wd" id="wDesc"></div></div></div>
      <div class="wsep"></div>
      <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
      <div class="gear" id="gear"><svg viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 100 6.8 3.4 3.4 0 000-6.8z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7 7 0 01-1.9 1.1L15 20h-3.6l-.4-1.9a7 7 0 01-1.9-1.1l-1.9.7-1.8-3.1 1.6-1.2a7 7 0 010-2.2L5.4 10l1.8-3.1 1.9.7A7 7 0 0111 6.5L11.4 4.6H15l.4 1.9a7 7 0 011.9 1.1l1.9-.7 1.8 3.1-1.6 1.2a7 7 0 010 2.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="kicker" id="hKick"></div>
    <div class="title" id="hTitle"></div>
    <div class="meta" id="hMeta"></div>
    <div class="desc" id="hDesc"></div>
    <div class="actions" id="hActions"></div>
    <div class="dots" id="hDots"></div>
  </div>

  <div class="info" id="info">
    <div class="kicker" id="iKick"></div>
    <div class="title" id="iTitle"></div>
    <div class="meta" id="iMeta"></div>
    <div class="desc" id="iDesc"></div>
  </div>

  <div class="track" id="track"></div>

  <!-- mreža: sve aplikacije / svi kanali -->
  <div class="layer glassbg" id="gridL">
    <h2><span id="gTitle"></span><small id="gSub"></small></h2>
    <div class="ghint">Drži OK = dodaj / ukloni ★</div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
  </div>

  <!-- detalji filma -->
  <div class="layer" id="detail">
    <div class="dbox">
      <div class="kicker" id="dKick"></div>
      <div class="title" id="dTitle"></div>
      <div class="meta" id="dMeta"></div>
      <div class="desc" id="dDesc"></div>
      <div class="actions" id="dActions"></div>
    </div>
  </div>

  <!-- YouTube player -->
  <div class="layer" id="player">
    <div id="plBg"></div><div class="spin" id="plSpin"></div>
    <div id="ytWrap"><div id="ytFrame"></div></div>
    <div class="pstate" id="pState"></div>
    <div class="osd" id="osd">
      <div class="ot" id="oTitle"></div><div class="oc" id="oChan"></div>
      <div class="obar"><span id="oCur">0:00</span><div class="bar"><i id="oBar"></i></div><span id="oDur">0:00</span></div>
      <div class="ohint">OK = pauza · ← → = premotaj 10 s · drži OK = otvori u YouTube aplikaciji · Nazad = izlaz</div>
    </div>
  </div>

  <!-- postavke -->
  <div class="layer glassbg" id="settings">
    <h2>Postavke<small>Ekran launcher</small></h2>
    <div class="sbox"><div class="slist" id="slist"></div></div>
  </div>

  <!-- meni -->
  <div class="layer" id="menu"><div class="mbox"><h4 id="mTitle"></h4><div id="mItems"></div></div></div>

  <div class="toast" id="toast"></div>
  <div class="hint" id="hint"><span>Pregled:</span><kbd>← → ↑ ↓</kbd><kbd>Enter</kbd><span>= OK (drži = opcije)</span><kbd>Esc</kbd><span>= nazad</span></div>
</div>

<script>
/* =====================================================================
   EKRAN — TV launcher (UI)
   Na TV-u ovo prikazuje Android aplikacija i daje window.LauncherBridge.
   Mrežni zahtjevi idu kroz /net?u=... (Android ih šalje, bez CORS-a).
   U browseru (pregled) radi demo režim s izmišljenim podacima.
   ===================================================================== */
const B = window.LauncherBridge || null;
const DEMO = !B;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem('ek_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ek_'+k,JSON.stringify(v))}catch(e){}}
};

/* ----- vijesti (RSS) ----- */
function parseRss(xml,srcName){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const items=[...doc.querySelectorAll('item, entry')].slice(0,25);
  const chan=srcName||(doc.querySelector('channel > title, feed > title')||{}).textContent||'Vijesti';
  return items.map(it=>{
    const q=s=>{const e=it.getElementsByTagName(s)[0];return e?e.textContent.trim():''};
    let title=q('title'),src=chan;
    const se=it.getElementsByTagName('source')[0];if(se){src=se.textContent.trim();title=title.replace(new RegExp('\\s+-\\s+'+src.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),'')}
    const html=q('content:encoded')||q('description')||q('summary')||q('content');
    let img='';
    for(const tag of ['media:content','media:thumbnail','enclosure']){const e=it.getElementsByTagName(tag)[0];if(e&&e.getAttribute('url')&&(!e.getAttribute('type')||/image/.test(e.getAttribute('type')))){img=e.getAttribute('url');break}}
    if(!img){const m=html.match(/<img[^>]+src=["']([^"']+)/i);if(m)img=m[1]}
    return {t:title,src,img,date:q('pubDate')||q('published')||q('updated')||q('dc:date'),d:strip(html).slice(0,260)};
  }).filter(x=>x.t);
}

/* ----- YouTube kanali (RSS, bez ključa) ----- */
async function resolveChannel(ch){
  if(ch.id)return ch;
  const q=ch.q.trim();
  if(/^UC[\w-]{22}$/.test(q)){ch.id=q;return ch}
  const path=q.startsWith('http')?q:('https://www.youtube.com/'+(q.startsWith('@')?q:'@'+q));
  const html=await net(path);
  const m=html.match(/"(?:channelId|externalId)":"(UC[\w-]{22})"/)||html.match(/channel\/(UC[\w-]{22})/);
  if(!m)throw new Error('kanal');
  ch.id=m[1];const n=html.match(/<meta property="og:title" content="([^"]+)"/);if(n)ch.name=n[1];
  return ch;
}

      if(link.includes('/shorts/'))return;
      all.push({id,t:q('title'),c:author,v:st?views(st.getAttribute('views')):'',date:q('published')});

/* ----- TV uživo (M3U) ----- */
function parseM3U(t){
  const out=[];let cur=null;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const name=l.replace(/^#EXTINF:[^,]*,/,'').trim();
      cur={n:name||'Kanal',l:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',g:(l.match(/group-title="([^"]*)"/)||[])[1]||''};
    }else if(!l.startsWith('#')){
      if(cur){cur.u=l;out.push(cur);cur=null}else out.push({n:l.split('/').pop(),l:'',g:'',u:l});
    }
  }
  return out;
}

function render(){
  if(S.layer)return LAYERS[S.layer].render();
  const st=$('#stage');
  st.classList.toggle('compact',S.row>0);
  const R=ROWS[Math.max(0,S.row)];
  $('#track').style.transform=`translateY(${S.row<=0?0:FOCUS_Y-R.y}px)`;
  ROWS.forEach((x,i)=>{if(x.el){x.el.classList.toggle('gone',S.row>0&&i<S.row);x.el.classList.toggle('active',i===S.row)}});
  markFocus();
  document.querySelectorAll('.moving').forEach(e=>e.classList.remove('moving'));
  if(S.row<=0){infoKey='';if(HERO[S.feat])setBg(HERO[S.feat].bg,true);return}
  const ci=curCol(R);
  const step=R.w+30,visible=1920-240,total=R.items.length*step-30;
  const off=Math.max(0,Math.min(ci*step-step,total-visible));
  R.strip.style.transform=`translateX(${-off}px)`;
  if(S.moving&&R.key==='apps')R.strip.children[ci].classList.add('moving');
  showInfo(R,R.items[ci]);
}

/* ---------- OK / dugo OK ---------- */
function activate(){
  if(S.layer)return LAYERS[S.layer].ok();
  if(S.row===-1)return openSettings();
  if(S.row===0){const a=HERO[S.feat].actions[S.btn];return a&&a.fn()}
  const R=ROWS[S.row],it=R.items[curCol(R)];
  if(S.moving){S.moving=null;saveSet();render();toast('Raspored sačuvan');return}
  switch(R.type){
    case 'apps':return launchApp(it);
    case 'cont':case 'yt':return openPlayer(it,'yt');
    case 'films':return openDetail(it);
    case 'live':return it.all?openGrid('live'):playLive(R.list,R.list.indexOf(it));
    case 'news':return;
  }
}
function longPress(){
  if(S.layer)return LAYERS[S.layer].long&&LAYERS[S.layer].long();
  if(S.row<=0)return;
  const R=ROWS[S.row],ci=curCol(R),it=R.items[ci];
  if(R.type==='apps'&&!it.glass)return openMenu(it.label,[
    {l:'Pomjeri (← →, pa OK)',fn:()=>{S.moving=it.pkg;render()}},
    {l:'Ukloni iz reda',fn:()=>{SET.favApps=SET.favApps.filter(p=>p!==it.pkg);saveSet();buildRows();render()}},
    {l:'Dodaj druge aplikacije…',fn:()=>openGrid('apps')}]);
  if(R.type==='cont'||R.type==='yt')return openMenu(it.t,[
    {l:'Otvori u YouTube aplikaciji',fn:()=>openYTApp(it.id)},
    ...(R.type==='cont'?[{l:'Ukloni s liste',fn:()=>{D.history=D.history.filter(x=>x.id!==it.id);store.set('history',D.history);buildRows();render()}}]:[])]);
  if(R.type==='live'&&!it.all)return toggleFavLive(it);
  if(R.type==='films')return openMenu(it.t,[{l:'Gledaj u Stremiu',fn:()=>openStremio(it)},{l:'Trailer',fn:()=>openTrailer(it)}]);
}
function moveApp(dir){
  const a=SET.favApps,i=a.indexOf(S.moving),j=i+dir;
  if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];buildRows();S.col.apps=j;render();
}
function toggleFavLive(c){
  const on=SET.favLive.includes(c.u);
  SET.favLive=on?SET.favLive.filter(u=>u!==c.u):[c.u,...SET.favLive];saveSet();
  toast(on?`${c.n} uklonjen iz omiljenih`:`${c.n} dodan u omiljene ★`);
}
function openYTApp(id){B?B.openYouTubeApp(id):toast('Otvaram u YouTube aplikaciji…')}

/* =====================================================================
   SLOJEVI: mreža, detalji, meni, player, postavke
   ===================================================================== */
const LAYERS={};
const covered=()=>$('#stage').classList.toggle('covered',S.layer==='detail'||S.layer==='player'||(S.prev||[]).includes('player'));
function pushLayer(name){S.prev=S.prev||[];if(S.layer)S.prev.push(S.layer);S.layer=name;$('#'+LAYERS[name].el).classList.add('on');covered();render()}
function popLayer(){const L=LAYERS[S.layer];$('#'+L.el).classList.remove('on');L.close&&L.close();S.layer=(S.prev&&S.prev.pop())||null;covered();render()}

/* ----- mreža (sve aplikacije / svi kanali) ----- */
const GR={kind:'apps',items:[],i:0,top:-1};
function openGrid(kind){
  GR.kind=kind;GR.i=0;GR.top=-1;
  GR.items=kind==='apps'?D.apps:liveOrdered();
  $('#gTitle').textContent=kind==='apps'?'Sve aplikacije':'TV uživo';
  $('#gSub').textContent=kind==='apps'?`${D.apps.length} instaliranih · ★ = u redu Aplikacije`:`${GR.items.length} kanala · ★ = omiljeni (prvi u redu)`;
  pushLayer('grid');
}
LAYERS.grid={el:'gridL',
  render(){
    const COLS=6,RH=kind()==='apps'?220:220,CW=250,GAPX=48;
    const fr=Math.floor(GR.i/COLS),top=Math.max(0,fr-1);
    const gr=$('#grid');
    if(top!==GR.top||gr.dataset.k!==GR.kind+GR.items.length+(GR.ver||0)){
      GR.top=top;gr.dataset.k=GR.kind+GR.items.length+(GR.ver||0);gr.innerHTML='';
      const R={grid:GR.kind,w:CW,h:141};
      for(let r=top;r<top+4;r++)for(let c=0;c<COLS;c++){
        const idx=r*COLS+c;if(idx>=GR.items.length)break;
        const el=cardFor(R,GR.items[idx],idx);el.dataset.i=idx;
        el.style.left=(c*(CW+GAPX))+'px';el.style.top=((r-top)*RH+20)+'px';
        el.onclick=()=>{if(GR.i===idx)LAYERS.grid.ok();else{GR.i=idx;render()}};
        gr.appendChild(el);
      }
    }
    gr.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));
    const f=gr.querySelector(`[data-i="${GR.i}"]`);if(f)f.classList.add('focus');
    function kind(){return GR.kind}
  },
  key(k){const n=GR.items.length,c=GR.i%6;
    if(k==='right'&&c<5&&GR.i<n-1)GR.i++;else if(k==='left'&&c>0)GR.i--;
    else if(k==='down'&&GR.i+6<n)GR.i+=6;else if(k==='down'&&Math.floor(GR.i/6)<Math.floor((n-1)/6))GR.i=n-1;
    else if(k==='up'&&GR.i-6>=0)GR.i-=6;render()},
  ok(){const it=GR.items[GR.i];if(!it)return;if(GR.kind==='apps')launchApp(it);else playLive(GR.items,GR.i)},
  long(){const it=GR.items[GR.i];if(!it)return;
    if(GR.kind==='apps'){const on=SET.favApps.includes(it.pkg);SET.favApps=on?SET.favApps.filter(p=>p!==it.pkg):[...SET.favApps,it.pkg];saveSet();toast(on?`${it.label} uklonjen iz reda`:`${it.label} dodan u red Aplikacije ★`)}
    else toggleFavLive(it);
    GR.ver=(GR.ver||0)+1;render()},
  close(){buildRows()}
};

/* ----- detalji filma ----- */
const DT={f:null,b:0,acts:[]};
function openDetail(f){
  DT.f=f;DT.b=0;
  $('#dKick').innerHTML=`<span class="pill">Film</span>${esc(f.g.join(' · '))}`;
  $('#dTitle').textContent=f.t;$('#dMeta').innerHTML=sepJoin([f.y,f.r?'★ '+f.r.toFixed(1):'']);$('#dDesc').textContent=f.d||'';
  DT.acts=[D.stremio?{l:'Gledaj u Stremiu',i:'play',fn:()=>openStremio(f)}:null,{l:'Trailer',i:'trailer',fn:()=>openTrailer(f)}].filter(Boolean);
  $('#dActions').innerHTML=DT.acts.map(a=>`<div class="btn">${icon(a.i)}${a.l}</div>`).join('');
  [...$('#dActions').children].forEach((b,j)=>b.onclick=()=>{DT.b=j;render();DT.acts[j].fn()});
  setBg(f.bg,true);pushLayer('detail');
  filmDetails(f).then(d=>{if(DT.f===f&&d.runtime)$('#dMeta').innerHTML=sepJoin([f.y,`${Math.floor(d.runtime/60)} h ${d.runtime%60} min`,f.r?'★ '+f.r.toFixed(1):''])}).catch(()=>{});
}
LAYERS.detail={el:'detail',
  render(){[...$('#dActions').children].forEach((b,j)=>b.classList.toggle('focus',j===DT.b))},
  key(k){if(k==='left'&&DT.b>0)DT.b--;if(k==='right'&&DT.b<DT.acts.length-1)DT.b++;render()},
  ok(){DT.acts[DT.b].fn()}
};

/* ----- meni ----- */
const MN={items:[],i:0};
function openMenu(title,items){MN.items=items;MN.i=0;$('#mTitle').textContent=title;
  $('#mItems').innerHTML=items.map(x=>`<div class="mitem">${esc(x.l)}</div>`).join('');
  [...$('#mItems').children].forEach((e,j)=>e.onclick=()=>{MN.i=j;LAYERS.menu.ok()});
  pushLayer('menu')}
LAYERS.menu={el:'menu',
  render(){[...$('#mItems').children].forEach((e,j)=>e.classList.toggle('focus',j===MN.i))},
  key(k){if(k==='down'&&MN.i<MN.items.length-1)MN.i++;if(k==='up'&&MN.i>0)MN.i--;render()},
  ok(){const fn=MN.items[MN.i].fn;popLayer();fn()}
};

/* ----- YouTube player (ugrađen, pamti dokle si stigao) ----- */
const PL={it:null,kind:'yt',yt:null,timer:null,osdT:null,demoPos:0,demoDur:0,playing:true};
let ytApi=null;
function ensureYT(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytApi)return ytApi;
  ytApi=new Promise((res,rej)=>{
    window.onYouTubeIframeAPIReady=()=>res();
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytApi=null;rej()};document.head.appendChild(s);
    setTimeout(()=>{if(!(window.YT&&window.YT.Player)){ytApi=null;rej()}},12000);
  });
  return ytApi;
}
function openPlayer(it,kind){
  PL.it=it;PL.kind=kind;PL.playing=true;
  const demo=DEMO||String(it.id).startsWith('d')||it.id==='demo';
  $('#plBg').style.backgroundImage=bgv(it.thumb||(demo?art(it.t,'hero',1920,1080):ytThumb(it.id,'hqdefault')));
  $('#oTitle').textContent=it.t;$('#oChan').textContent=it.c||'';
  $('#plSpin').style.display='block';$('#ytWrap').innerHTML='<div id="ytFrame"></div>';
  pushLayer('player');osd();
  const prev=D.history.find(x=>x.id===it.id);
  const start=kind==='yt'&&prev&&prev.pos/prev.dur<.95?Math.max(0,prev.pos-3):0;
  if(demo){PL.demoDur=prev?prev.dur:900;PL.demoPos=start;$('#plSpin').style.display='none';
    clearInterval(PL.timer);PL.timer=setInterval(()=>{if(PL.playing)PL.demoPos=Math.min(PL.demoDur,PL.demoPos+1);updOsd()},1000);
    toast('Pregled: na TV-u ovdje ide pravi YouTube video');return}
  ensureYT().then(()=>{
    if(S.layer!=='player'||PL.it!==it)return;
    PL.yt=new YT.Player('ytFrame',{width:1920,height:1080,videoId:it.id,
      playerVars:{autoplay:1,controls:0,rel:0,iv_load_policy:3,modestbranding:1,playsinline:1,fs:0,disablekb:1,start:Math.floor(start),origin:location.origin},
      events:{
        onReady:e=>{e.target.playVideo()},
        onStateChange:e=>{if(e.data===1){$('#plSpin').style.display='none';PL.playing=true}if(e.data===2)PL.playing=false;if(e.data===0){savePos();popLayer()}},
        onError:()=>{popLayer();openYTApp(it.id);toast('Ovaj video se otvara u YouTube aplikaciji')}
      }});
    clearInterval(PL.timer);PL.timer=setInterval(()=>{updOsd();savePos(true)},1000);
  }).catch(()=>{popLayer();openYTApp(it.id)});
}
function curTimes(){
  if(PL.yt&&PL.yt.getCurrentTime)try{return [PL.yt.getCurrentTime()||0,PL.yt.getDuration()||0]}catch(e){}
  return [PL.demoPos,PL.demoDur];
}
let saveTick=0;
function savePos(throttle){if(PL.kind!=='yt')return;if(throttle&&(++saveTick%5))return;const [p,d]=curTimes();if(d)saveHistory(PL.it,p,d)}
function updOsd(){const [p,d]=curTimes();$('#oCur').textContent=tfmt(p);$('#oDur').textContent=tfmt(d);$('#oBar').style.width=(d?p/d*100:0)+'%'}
function osd(){const o=$('#osd');o.classList.remove('hide');updOsd();clearTimeout(PL.osdT);PL.osdT=setTimeout(()=>{if(PL.playing)o.classList.add('hide')},3500)}
function pstate(ic){const p=$('#pState');p.innerHTML=icon(ic,'#fff');p.classList.add('on');setTimeout(()=>p.classList.remove('on'),700)}
LAYERS.player={el:'player',
  render(){},
  key(k){
    if(k==='left'||k==='right'){const [p,d]=curTimes();const np=Math.max(0,Math.min(d-1,p+(k==='right'?10:-10)));
      if(PL.yt&&PL.yt.seekTo)PL.yt.seekTo(np,true);else PL.demoPos=np;}
    osd();
  },
  ok(){PL.playing=!PL.playing;
    if(PL.yt&&PL.yt.pauseVideo){PL.playing?PL.yt.playVideo():PL.yt.pauseVideo()}
    pstate(PL.playing?'play':'pause');osd()},
  long(){const id=PL.it.id;popLayer();openYTApp(id)},
  close(){savePos();clearInterval(PL.timer);try{PL.yt&&PL.yt.destroy()}catch(e){}PL.yt=null;$('#ytWrap').innerHTML='';buildRows()}
};

/* ----- postavke ----- */
const ST={i:0,items:[]};
function openSettings(){ST.i=0;buildSettings();pushLayer('settings')}
function buildSettings(){
  const it=[];
  it.push({h:'Vrijeme'});
  it.push({type:'input',l:'Grad',s:'Prazno = automatski po lokaciji',key:'city',ph:'npr. Sarajevo'});
  it.push({h:'Filmovi (TMDB)'});
  it.push({type:'input',l:'TMDB API ključ',s:'Besplatno na themoviedb.org → Settings → API',key:'tmdb',ph:'32 znaka (API Key)'});
  it.push({h:'TV uživo'});
  it.push({type:'input',l:'M3U link',s:'Lista kanala (http… .m3u / .m3u8)',key:'m3u',ph:'https://…'});
  it.push({type:'btn',l:'Učitaj kanale sada',v:D.live.length?D.live.length+' kanala':'—',fn:()=>loadLive(true).then(()=>{buildRows();buildSettings();render()})});
  it.push({h:'YouTube kanali'});
  it.push({type:'input',l:'Dodaj kanal',s:'@ime kanala ili link · OK za dodavanje',key:'__addch',ph:'@kanal'});
  SET.channels.forEach((ch,j)=>it.push({type:'btn',l:ch.name||ch.q,v:'OK = ukloni',fn:()=>{SET.channels.splice(j,1);saveSet();D.yt=D.yt.filter(v=>v.c!==ch.name);buildSettings();render()}}));
  it.push({h:'Vijesti'});
  Object.keys(NEWS_SRC).forEach(k=>it.push({type:'tog',l:NEWS_SRC[k].name,get:()=>SET.news[k],fn:()=>{SET.news[k]=!SET.news[k];saveSet();buildSettings();render()}}));
  it.push({type:'input',l:'Dodatni RSS',s:'Link na RSS vijesti (opcionalno)',key:'extraRss',ph:'https://…/rss'});
  it.push({h:'Sistem'});
  it.push({type:'btn',l:'Postavke TV-a',v:'Android postavke',fn:()=>B?B.openSystemSettings():toast('Otvaram Android postavke…')});
  it.push({type:'btn',l:'Osvježi sve',v:'Vijesti, filmovi, kanali',fn:()=>{refreshAll(true);toast('Osvježavam…')}});
  ST.items=it;
  const L=$('#slist');L.innerHTML='';
  it.forEach((x,j)=>{
    const e=document.createElement('div');
    if(x.h){e.className='sh';e.textContent=x.h;L.appendChild(e);return}
    e.className='si';e.dataset.j=j;
    e.innerHTML=`<div class="sl">${esc(x.l)}${x.s?`<small>${esc(x.s)}</small>`:''}</div>`+
      (x.type==='input'?`<input type="text" placeholder="${esc(x.ph||'')}" value="${x.key.startsWith('__')?'':esc(SET[x.key]||'')}" spellcheck="false" autocomplete="off">`:
       x.type==='tog'?`<div class="tog${x.get()?' on':''}"></div>`:`<div class="sv">${esc(x.v||'')}</div>`);
    if(x.type==='input'){const inp=e.querySelector('input');
      inp.addEventListener('change',()=>commitInput(x,inp));
      inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();commitInput(x,inp);inp.blur()}});}
    e.onclick=()=>{ST.i=j;render();LAYERS.settings.ok()};
    L.appendChild(e);
  });
  if(!ST.items[ST.i]||ST.items[ST.i].h)ST.i=ST.items.findIndex(x=>!x.h);
}
function commitInput(x,inp){
  const v=inp.value.trim();
  if(x.key==='__addch'){if(v&&!SET.channels.some(c=>c.q===v)){SET.channels.push({q:v,id:null,name:v});saveSet();inp.value='';toast('Kanal dodan — učitavam…');loadYT().then(()=>{buildRows();buildSettings();render()})}return}
  if(SET[x.key]===v)return;SET[x.key]=v;saveSet();
  if(x.key==='city')loadWeather();
  if(x.key==='tmdb')loadFilms().then(()=>{buildHero();buildRows();showFeatured(0,true)});
  if(x.key==='m3u')loadLive(true).then(()=>{buildRows();buildSettings();render()});
  if(x.key==='extraRss')loadNews().then(()=>buildRows());
}
LAYERS.settings={el:'settings',
  render(){
    document.querySelectorAll('#slist .focus').forEach(e=>e.classList.remove('focus'));
    const e=document.querySelector(`#slist [data-j="${ST.i}"]`);if(!e)return;e.classList.add('focus');
    const y=e.offsetTop;$('#slist').style.transform=`translateY(${-Math.max(0,y-300)}px)`;
  },
  key(k){
    const step=d=>{let j=ST.i;do{j+=d}while(ST.items[j]&&ST.items[j].h);if(ST.items[j])ST.i=j};
    if(k==='down')step(1);if(k==='up')step(-1);render()},
  ok(){const x=ST.items[ST.i];if(!x)return;
    if(x.type==='input'){const inp=document.querySelector(`#slist [data-j="${ST.i}"] input`);inp.focus();return}
    x.fn&&x.fn()},
  close(){document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}
};

/* =====================================================================
   DALJINSKI
   ===================================================================== */
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
let okDown=0,okLong=false,okTimer=null;
function back(){
  const a=document.activeElement;if(a&&a.tagName==='INPUT'){a.blur();return true}
  if(S.layer){popLayer();return true}
  if(S.moving){S.moving=null;saveSet();render();return true}
  if(S.row!==0){S.row=0;render();return true}
  if(HERO.length>1){showFeatured(0)}
  return false;
}
window.launcherBack=back;
window.launcherMenu=()=>longPress();
window.launcherPause=()=>{if(S.layer==='player'&&PL.yt&&PL.yt.pauseVideo){try{PL.yt.pauseVideo()}catch(e){}PL.playing=false;savePos()}};
window.launcherResume=()=>{loadApps();if(S.layer==='grid'&&GR.kind==='apps')GR.items=D.apps;buildRows();render();if(Date.now()-lastRefresh>15*60e3)refreshAll()};

document.addEventListener('keydown',e=>{
  const a=document.activeElement,inInput=a&&a.tagName==='INPUT';
  if(inInput){
    if(e.key==='Escape'){e.preventDefault();a.blur()}
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();a.blur();LAYERS.settings.key(KEYMAP[e.key])}
    return;
  }
  const k=e.key;
  if(k==='Enter'||k===' '){e.preventDefault();
    if(e.repeat||okDown)return;
    okDown=Date.now();okLong=false;clearTimeout(okTimer);
    okTimer=setTimeout(()=>{okLong=true;longPress()},650);
    return;
  }
  if(k==='Escape'||k==='Backspace'||k==='GoBack'||k==='BrowserBack'){e.preventDefault();back();return}
  if(k==='ContextMenu'){e.preventDefault();longPress();return}
  const d=KEYMAP[k];if(!d)return;e.preventDefault();
  $('#hint').style.opacity=0;
  if(S.layer)return LAYERS[S.layer].key(d);
  if(S.moving){if(d==='left')moveApp(-1);if(d==='right')moveApp(1);return}
  if(d==='down'&&S.row<ROWS.length-1)S.row++;
  else if(d==='up'&&S.row>-1)S.row--;
  else if(d==='right'){
    if(S.row===-1){}
    else if(S.row===0){if(S.btn<HERO[S.feat].actions.length-1)S.btn++;else if(HERO.length>1)showFeatured(S.feat+1)}
    else{const R=ROWS[S.row];S.col[R.key]=Math.min(curCol(R)+1,R.items.length-1)}
  }else if(d==='left'){
    if(S.row===0){if(S.btn>0)S.btn--;else if(HERO.length>1)showFeatured(S.feat-1)}
    else if(S.row>0){const R=ROWS[S.row];S.col[R.key]=Math.max(curCol(R)-1,0)}
  }
  render();
});
document.addEventListener('keyup',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
  clearTimeout(okTimer);
  if(okDown&&!okLong)activate();
  okDown=0;okLong=false;
});
$('#gear').onclick=()=>{S.row=-1;render();openSettings()};

/* ---------- sat ---------- */
function tick(){
  const d=new Date(),h=d.getHours();
  $('#time').textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#date').textContent=`${DANI[d.getDay()]}, ${d.getDate()}. ${MJ[d.getMonth()]}`;
  $('#greet').textContent=h<5?'Laku noć':h<12?'Dobro jutro':h<18?'Dobar dan':'Dobro veče';
}
setInterval(tick,10000);tick();

/* ---------- skaliranje ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
if(!DEMO)$('#hint').style.display='none';

/* ---------- pokretanje ---------- */
let lastRefresh=0;
async function refreshAll(force){
  lastRefresh=Date.now();
  loadWeather();
  const jobs=[loadNews(),loadFilms(),loadYT(),loadLive(force)];
  jobs.forEach(p=>p.then(()=>{const heroWas=HERO.length&&HERO[0].t;buildHero();buildRows();if(!HERO.length||HERO[0].t!==heroWas)showFeatured(S.feat,true);render()}).catch(()=>{}));
}
loadApps();buildHero();buildRows();showFeatured(0,true);render();
refreshAll();
setInterval(()=>loadWeather(),30*60e3);
setInterval(()=>{if(!S.layer)refreshAll()},20*60e3);
</script>
